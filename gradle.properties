# Project-wide Gradle settings for DSH Mobile.

# AndroidX is required — every dependency (core-ktx, compose, lifecycle, webkit)
# is an AndroidX artifact. Without this the build fails at checkAarMetadata.
android.useAndroidX=true

# Jetifier is unnecessary: all deps are already AndroidX. Leaving it off avoids
# rewriting bytecode on every build.
android.enableJetifier=false

# Non-transitive R classes: smaller R.java, faster builds.
android.nonTransitiveRClass=true

# Kotlin + AGP incremental/parallel knobs.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

# The Kotlin compile daemon needs a writable run dir under
# ~/Library/Application Support, which is unavailable in sandboxed/CI runs.
# Compiling in-process is slower per build but deterministic and portable.
kotlin.compiler.execution.strategy=in-process